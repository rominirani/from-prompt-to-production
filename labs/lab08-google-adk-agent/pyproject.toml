[project]
name = "lab08-google-adk-agent"
version = "0.1.0"
description = "Lab 08: Multi-Agent Event Concierge built with Google ADK (Agent Development Kit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[project]
name = "lab05-fastapi-database"
version = "0.1.0"
description = "Lab 05: Workshop & Event Registration API with FastAPI, Pydantic v2, and SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[project]
name = "from-prompt-to-production"
version = "0.1.0"
description = "From Prompt to Production with Python & Google AI — Companion Codebase & Labs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "fastapi>=0.130.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "google-adk>=1.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["labs"]
python_files = ["test_*.py"]

[project]
name = "lab07-web-ui-and-browser"
version = "0.1.0"
description = "Lab 07: Smart Pantry & Recipe Tracker Web App with FastAPI, HTMX, Gemini Structured Recipes, and Strict XSS/CSP Protections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[project]
name = "lab04-customizing-antigravity"
version = "0.1.0"
description = "Lab 04: Modular Study Session Tracker with GEMINI.md, AGENTS.md, Skills, and Hooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
